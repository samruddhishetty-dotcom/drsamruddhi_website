<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Adoption Readiness Decision Support System</title>


<style>
*{box-sizing:border-box}

body{
margin:0;
padding:18px;
font-family:Arial,sans-serif;
background:#faf7f8;
color:#3b2d33;
}

.container{
max-width:900px;
margin:auto;
background:#ffffff;
padding:28px;
border-radius:24px;
box-shadow:0 8px 28px rgba(91,52,67,.08);
border:1px solid #f1e5ea;
}

h1{
font-family:Georgia,serif;
text-align:center;
color:#6b2144;
font-size:34px;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#7c6570;
margin-bottom:28px;
}

.home-btn{
display:inline-block;
text-decoration:none;
background:#6b2144;
color:white;
padding:10px 18px;
border-radius:30px;
font-weight:600;
}

.section{
background:#fcfbfc;
padding:22px;
border-radius:20px;
margin-top:24px;
border-left:5px solid #d4a5b7;
}

.section h3{
margin-top:0;
color:#6b2144;
font-family:Georgia,serif;
}

.question{
padding:18px 0;
border-bottom:1px solid #f0dde5;
}

.question:last-child{
border-bottom:none;
}

.qtext{
font-weight:600;
margin-bottom:12px;
line-height:1.5;
}

.likert{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
}

.likert input{
display:none;
}

.likert label{
display:block;
background:white;
border:2px solid #dbc2cb;
border-radius:16px;
padding:14px 8px;
text-align:center;
cursor:pointer;
transition:.2s;
font-size:13px;
}

.likert label span{
display:block;
font-size:18px;
font-weight:bold;
margin-bottom:4px;
color:#6b2144;
}

.likert input:checked + label{
background:#f8eaf0;
border-color:#6b2144;
transform:scale(1.02);
box-shadow:0 4px 12px rgba(107,33,68,.12);
}

button{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
background:#6b2144;
color:white;
font-weight:600;
cursor:pointer;
}

button:hover{
opacity:.95;
}

#result{
display:none;
margin-top:30px;
background:#fff7fa;
border:1px solid #ecd5de;
padding:24px;
border-radius:20px;
}

.score{
font-size:30px;
font-weight:bold;
color:#6b2144;
}

.progress{
height:26px;
background:#ead9df;
border-radius:30px;
overflow:hidden;
margin-top:18px;
}

.bar{
height:100%;
width:0%;
background:linear-gradient(90deg,#d4a5b7,#6b2144);
transition:1s;
}

@media(max-width:600px){
h1{font-size:28px;}

.likert{
grid-template-columns:1fr;
}

.likert label{
text-align:left;
padding-left:18px;
}
}
.highlight{
animation:pulseGlow 1.2s infinite;
border:3px solid #6b2144;
}

@keyframes pulseGlow{

0%{
transform:scale(1);
box-shadow:0 0 0 rgba(107,33,68,0);
}

50%{
transform:scale(1.02);
box-shadow:0 0 28px rgba(107,33,68,.35);
}

100%{
transform:scale(1);
box-shadow:0 0 0 rgba(107,33,68,0);
}

}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="home-btn">← Back Home</a>

<h1>AI Adoption Readiness Assessment</h1>

<p class="subtitle">
1 = Strongly Disagree • 5 = Strongly Agree
</p>


<script>
function q(prefix,id,text){
document.write(`
<div class='question'>
<div class='qtext'>${text}</div>
<div class='likert'>
${[1,2,3,4,5].map(v=>`
<input type='radio' id='${prefix}${id}${v}' name='${prefix}${id}' value='${v}'>
<label for='${prefix}${id}${v}'><span>${v}</span>
${['Strongly Disagree','Disagree','Neutral','Agree','Strongly Agree'][v-1]}
</label>`).join('')}
</div>
</div>
`);
}

function section(title,prefix,items){
document.write("<div class='section'><h3>"+title+"</h3>");
items.forEach((t,i)=>q(prefix,i+1,t));
document.write("</div>");
}
</script>


<script>

section("Performance Expectancy","pe",[
"AI improves project outcomes",
"AI increases productivity",
"AI improves decision quality"
]);

section("Effort Expectancy","ee",[
"AI tools are easy to use",
"Learning AI requires little effort",
"Interaction with AI is understandable"
]);

section("Facilitating Conditions","fc",[
"Resources exist to support AI use",
"Technical support is available",
"Infrastructure supports AI adoption"
]);

section("Price Value","pv",[
"AI provides value relative to cost",
"Benefits justify implementation cost",
"AI creates economic advantage"
]);

section("Social Influence","si",[
"Important others support AI adoption",
"Peers influence AI use decisions",
"Management encourages AI adoption"
]);

section("AI Self-Efficacy","a",[
"I feel confident using AI tools",
"I can solve problems using AI",
"I can learn AI applications quickly"
]);

section("Responsible AI","r",[
"AI should be transparent",
"Ethical safeguards are important",
"AI decisions should minimize bias"
]);

section("Sustainable AI","s",[
"AI supports long-term sustainability",
"AI should support responsible resource use",
"AI creates long-term societal value"
]);

</script>


<button onclick="calc()">
Calculate Readiness
</button>


<div id="result">
<div id="banner" style="
background:#6b2144;
color:white;
padding:12px;
border-radius:12px;
margin-bottom:15px;
font-weight:bold;
text-align:center;">
✔ Assessment Result Generated Below
</div>
<div class="score" id="score"></div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="recommend"></p>
</div>


</div>


<script>

function getVal(name){
return parseFloat(
document.querySelector('input[name="'+name+'"]:checked').value
);
}

function avg(a){
return a.reduce((x,y)=>x+y)/a.length;
}

function calc(){

try{

let PE=avg([getVal("pe1"),getVal("pe2"),getVal("pe3")]);
let EE=avg([getVal("ee1"),getVal("ee2"),getVal("ee3")]);
let FC=avg([getVal("fc1"),getVal("fc2"),getVal("fc3")]);
let PV=avg([getVal("pv1"),getVal("pv2"),getVal("pv3")]);
let SI=avg([getVal("si1"),getVal("si2"),getVal("si3")]);

let AISE=avg([getVal("a1"),getVal("a2"),getVal("a3")]);
let RAI=avg([getVal("r1"),getVal("r2"),getVal("r3")]);
let SAI=avg([getVal("s1"),getVal("s2"),getVal("s3")]);


/* Derived higher-order TRF */
let TRF=(PE+EE+FC+PV+SI)/5;


/* adoption score */
let readiness=
((AISE*.34)+
(RAI*.33)+
(SAI*.33))/5*100;


/* hygiene gating */
if(TRF<3){
readiness*=0.60;
rec="Low TRF readiness. Strengthen foundational readiness before adoption.";
}
else if(TRF<3.8){
readiness*=0.85;
rec="Moderate readiness. Improve readiness enablers before scaling.";
}
else{
rec="High readiness. Conditions support AI adoption.";
}

let level="";

if(readiness<50)
level="Low";

else if(readiness<75)
level="Moderate";

else
level="High";

let resultBox = document.getElementById("result");

resultBox.style.display="block";

/* flash highlight */
resultBox.classList.add("highlight");

/* smooth scroll to result */
resultBox.scrollIntoView({
behavior:"smooth",
block:"center"
});

/* remove pulse after 4 sec */
setTimeout(()=>{
resultBox.classList.remove("highlight");
},4000);

document.getElementById("score").innerHTML=
Math.round(readiness)+"% — "+level+" Readiness";

document.getElementById("bar").style.width=
Math.round(readiness)+"%";

document.getElementById("recommend").innerHTML=
"<b>Recommendation:</b> "+rec;

}
catch{
alert("Please answer all questions.");
}

}

</script>

</body>
</html>
